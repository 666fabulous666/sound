[package]
name = "synth"
version = "0.1.0"
edition = "2021"

[lib]
name = "synth_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["glow"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itertools = "*"
anyhow = "1"
log = "0.4" # useful on both targets

# -------- desktop-only --------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15.3"
winit = "0.28.0"
hound = "3.5.0"
crossterm = "0.27"
rfd = "0.14"

# -------- web-only --------
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15.3", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console","Window","Document"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
web-time = "0.2"
