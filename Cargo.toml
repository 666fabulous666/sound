[workspace]
resolver = "2"
members = [
    "synth-core",
    "synth-cli",
    "synth-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fabien Mathieu"]

[workspace.dependencies]
# Core audio dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
itertools = "0.14.0"
hound = "3.5.0"
anyhow = "1"
log = "0.4"
arc-swap = "1.7.1"
num-traits = "0.2.19"

# Audio playback
cpal = "0.15"

# GUI dependencies
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "25", features = ["webgpu", "webgl"] }
epaint = "0.32.3"
winit = "0.28.0"
rfd = "0.14"
instant = "0.1.13"
egui_commonmark = "0.21.1"
image = "0.25.8"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
